name: Build RandomizerItem

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build Mod
        run: chmod +x gradlew && ./gradlew build

      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: RandomizerItem-jar
          path: build/libs/*.jar
